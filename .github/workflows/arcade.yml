name: "✦ summon the midnight arcade ✦"

# Builds the snake, pac-man & breakout games from your contribution graph,
# repaints them black & pink, and publishes them to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: "🐍 snake"
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff1f8e&color_dots=#1c0b15,#4a0f2e,#8c1650,#d6246e,#ff6eb4

      - name: "👻 pac-man & 🧱 breakout"
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      - name: "🦇 paint it black & pink"
        run: bash .github/scripts/gothify.sh dist

      - name: "🚀 publish to the output branch"
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
